services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aquinas
      POSTGRES_PASSWORD: aquinas
      POSTGRES_DB: aquinas
    ports:
      - "5432:5432"
    volumes:
      - aquinas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquinas -d aquinas"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://aquinas:aquinas@db:5432/aquinas
    depends_on:
      db:
        condition: service_healthy

volumes:
  aquinas_pgdata:
